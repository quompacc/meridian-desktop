<!doctype html>
<html lang="de" data-meridian-theme="@@MERIDIAN_THEME@@">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src meridian-icon:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
    <title>Meridian Panel</title>
    <style>
@@MERIDIAN_TOKENS@@
@@MERIDIAN_PANEL_CSS@@
    </style>
  </head>
  <body>
    @@MERIDIAN_ICON_SPRITE@@
    <main class="panel" aria-label="Desktop-Leiste">
      <section class="panel__leading" aria-label="Anwendungen">
        <button class="control launcher-button" type="button" aria-label="Anwendungen öffnen" title="Anwendungen">
          <svg class="icon" aria-hidden="true"><use href="#launcher"></use></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <div class="pinned" aria-label="Angeheftete Anwendungen">
@@MERIDIAN_PANEL_APPS@@
        </div>
      </section>

      <section class="panel__trailing" aria-label="Systemstatus">
        <button class="control quiet" type="button" aria-label="Bildschirmfoto" title="Bildschirmfoto">
          <svg class="icon" aria-hidden="true"><use href="#screenshot"></use></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="control quiet" type="button" aria-label="Netzwerk verbunden" title="Netzwerk">
          <svg class="icon" aria-hidden="true"><use href="#network"></use></svg>
        </button>
        <button class="control quiet" type="button" aria-label="Lautstärke" title="Lautstärke">
          <svg class="icon" aria-hidden="true"><use href="#volume"></use></svg>
        </button>
        <button class="control battery" type="button" aria-label="Akku 84 Prozent" title="Akku: 84 %">
          <svg class="icon" aria-hidden="true"><use href="#battery"></use></svg>
          <span>84</span>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="workspace" type="button" aria-label="Arbeitsfläche 1 von 4" title="Arbeitsflächen">
          <span class="workspace__mark"></span><strong>1</strong><span>/ 4</span>
        </button>
        <button class="clock" type="button" aria-label="Datum und Uhrzeit" title="Kalender">
          <strong data-clock>--:--</strong><span data-date>---</span>
        </button>
        <button class="control quiet system-menu" type="button" aria-label="Systemmenü" title="Systemmenü">
          <svg class="icon" aria-hidden="true"><use href="#chevron-up"></use></svg>
        </button>
      </section>
    </main>
    <script>
@@MERIDIAN_PANEL_SCRIPT@@
    </script>
  </body>
</html>
