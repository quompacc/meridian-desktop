[package]
name = "meridian-lock"
version.workspace = true
edition = "2021"

[[bin]]
name = "meridian-lock"
path = "src/main.rs"

[[bin]]
name = "meridian-openbsd-auth"
path = "src/bin/meridian-openbsd-auth.rs"

[dependencies]
meridian-config = { path = "../meridian-config" }
meridian-tokens = { path = "../meridian-tokens" }
meridian-ui = { path = "../meridian-ui" }
libc = "0.2"
tiny-skia = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
xkbcommon = "0.8"
zeroize = "1"

[target.'cfg(not(target_os = "openbsd"))'.dependencies]
pam-sys = "1.0.0-alpha5"
