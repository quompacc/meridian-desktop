# Meridian — DARK theme.
#
# Per the GUI centralization model this file carries ONLY the colour table
# (plus the icon set). All geometry, radii, shadows and glass treatment
# come from the central Rust defaults in `meridian-config` (Decorations::default)
# so dark and light stay identical in everything but colour.
#
# These values mirror `meridian_tokens::Palette::DARK` (the single source).

[colors]
background = "#14171b"
surface = "#20252b"
surface_alt = "#1b1f24"
accent = "#4e99f3"
accent_alt = "#4383ce"
text = "#dcdee1"
text_dim = "#888d93"
border = "#353a40"
error = "#b5685c"
warning = "#b89a6a"
success = "#6fa08c"

[icons]
# Both themes use "Papirus": it is the only installed set that ships the
# `-symbolic` status icons, and the shell recolours those to the theme text
# colour at load time (see icons/svg.rs). So contrast is automatic — dark theme
# → light icons, light theme → dark icons — from ONE icon set.
theme = "Papirus"

# NOTE: no [wallpaper] here on purpose. The wallpaper is a USER setting
# (config.toml [wallpaper]) plus a built-in default — never carried by the theme,
# so switching theme never changes the wallpaper.
