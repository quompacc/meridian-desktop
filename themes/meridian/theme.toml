shadow_radius_top = 11
shadow_alpha = 0.40
shadow_offset_y = 3
gap = 8
glass = true
glass_blur = true
glass_blur_radius = 10
glass_tint = 0.5
glass_frame_alpha = 0.4
glass_button_alpha = 0.45
glass_alpha = 0.55
glass_specular = 0.6

[fonts]
ui = "Inter 11"

[icons]
theme = "Papirus-Dark"

[cursor]
theme = "Breeze_Light"
size = 24

[wallpaper]
path = "assets/wallpaper.png"
mode = "fill"
