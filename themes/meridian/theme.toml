[colors]
background = "#10161b"
surface = "#1b242d"
surface_alt = "#161e25"
accent = "#4e99f3"
accent_alt = "#4383ce"
text = "#dcdee1"
text_dim = "#828990"
border = "#303740"
error = "#b5685c"
warning = "#b89a6a"
success = "#6fa08c"

[decorations]
border_width = 1
corner_radius = 10
shadow = true
