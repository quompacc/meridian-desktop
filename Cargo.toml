[workspace]
members = [
    ".",
    "crates/meridian-compositor",
    "crates/meridian-wm",
    "crates/meridian-shell",
    "crates/meridian-ipc",
    "crates/meridian-config",
    "crates/meridian-tokens",
    "crates/meridian-portal",
    "crates/meridian-ui",
    "crates/meridian-freetype",
    "crates/meridian-login",
    "crates/meridian-lock",
    "crates/meridian-polkit",
    "crates/meridian-compass-render",
    "crates/meridian-boot-common",
]
exclude = ["third_party/smithay"]

[workspace.package]
version = "0.5.1"

[workspace.dependencies]
bitflags = "2"
# OpenBSD needs a small target-native Smithay port layer. The vendored source is
# exactly upstream 060e9cd9 plus the documented changes in
# third_party/smithay/OPENBSD_PORT.md.
smithay = { path = "third_party/smithay", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_winit",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
taffy = "0.7"
tiny-skia = "0.11"
ab_glyph = "0.2"

[package]
name = "meridian"
version.workspace = true
edition = "2021"

[dependencies]
libc = "0.2"
meridian-compositor = { path = "crates/meridian-compositor" }
smithay = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
